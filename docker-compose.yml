services:
  db:
    image: mysql:8.0
    container_name: movie_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: movie_recommendation_system_db
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      TZ: UTC
    ports:
      - '3306:3306'
    volumes:
      - dbdata:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie_backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.docker
    ports:
      - '8000:8000'
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: sh -c "composer install && php artisan key:generate --force && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: movie_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_BASE_URL=http://backend:8000
    volumes:
      - ./frontend:/usr/src/app
    command: sh -c "npm install && npm start"
    depends_on:
      - backend

volumes:
  dbdata:
